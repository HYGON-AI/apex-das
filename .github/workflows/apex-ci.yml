name: Apex CI

on:
  pull_request:
    branches:
      - ci-test
  push:
    branches:
      - ci-test

permissions:
  contents: read

env:
  PIP_INDEX_URL: "http://10.16.1.201:9929/nightly/dtk2604/+simple/"
  PIP_TRUSTED_HOST: "10.16.1.201"
  DTK_PKG: "/ArchivedFile/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz"
  DEVPI_URL: "http://10.16.1.201:9929/"
  TORCH_VERSION: "2.10.0"
  REPORTS_DIR: ${{ github.workspace }}/reports

jobs:
  build-apex-wheel:
    name: Build and test wheel
    if: github.event_name == 'pull_request'
    runs-on:
      - self-hosted
      - bw18
    timeout-minutes: 180
    container:
      image: image.sourcefind.cn:5000/dcu/admin/base/dev:rockylinux8.6-mpi5.0-gcc10.3-cmake3.29-py3.10-mkl2020.4.304
      volumes:
        - /ArchivedFile:/ArchivedFile:ro
        - /opt/hyhal/:/opt/hyhal/:ro
      options: >-
        --shm-size=16g
        --network=host
        --device=/dev/kfd
        --device=/dev/dri/
        --group-add=video
        --privileged
    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@v4

      - name: Install DTK and AICC
        shell: bash
        run: |
          set -eu

          cp -f "${DTK_PKG}" /opt/
          cd /opt
          tar -xzf "$(basename "${DTK_PKG}")"
          mv dtk-* dtk

          src_dir="/ArchivedFile/ai_cc/nightly"
          latest_run=$(cd "${src_dir}" && find . -maxdepth 1 -type f -name 'dtk_llvm_*.run' -printf '%f\n' | sed 's/\.run$//' | sort -t '_' -k4 -nr | head -n1)
          if [[ -n "${latest_run}" ]]; then
            cp "${src_dir}/${latest_run}.run" "${GITHUB_WORKSPACE}/"
            cd "${GITHUB_WORKSPACE}"
            chmod +x "${latest_run}.run"
            yes | bash "${latest_run}.run"
            echo "AICC installation completed"
          else
            echo "No AICC installer found; skipping installation"
          fi

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          source /opt/dtk/env.sh
          cd "${GITHUB_WORKSPACE}"
          pip3 install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple --trusted-host pypi.tuna.tsinghua.edu.cn
          pip install "torch==${TORCH_VERSION}"
          bash scripts/install_with_torch.sh torchvision ${TORCH_VERSION}
          bash scripts/install_with_torch.sh triton ${TORCH_VERSION}
          pip install numpy==1.24.3 pytest wheel cloudpickle expecttest
          pip install auditwheel patchelf==0.17.2.4
          mkdir -p "${REPORTS_DIR}"

      - name: Build wheel
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/compile.sh > compile.log 2>&1
          tail -n 100 compile.log

      - name: Repair manylinux wheel
        shell: bash
        run: |
          set -euo pipefail
          source /opt/dtk/env.sh
          bash scripts/repair_manylinux.sh

      - name: Install and verify wheel
        shell: bash
        run: |
          set -euo pipefail
          source /opt/dtk/env.sh
          pip uninstall -y apex || true
          ls dist/*manylinux*.whl
          pip install --no-deps --force-reinstall dist/*manylinux*.whl
          python -c "import apex; print('apex loaded from:', apex.__file__)"

      - name: Run tests
        shell: bash
        run: |
          export LOG="${REPORTS_DIR}/apex_test.log"
          export JUNIT_DIR="${REPORTS_DIR}"
          export WORK_SPACE="${GITHUB_WORKSPACE}"

          set +e
          bash scripts/test.sh
          test_exit=$?
          set -e

          python3 scripts/parse_apex_log_to_junit.py "${LOG}" -o "${REPORTS_DIR}/apex_test_junit.xml" || true
          exit "${test_exit}"

      - name: Upload wheel and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-wheel-and-test-reports
          path: |
            dist/*.whl
            reports/apex_test_junit.xml
            reports/apex_test.log
          if-no-files-found: warn
          retention-days: 30

      
  publish:
    name: Build and publish wheel
    if: github.event_name == 'push'
    runs-on:
      - self-hosted
      - bw18
    timeout-minutes: 180
    container:
      image: image.sourcefind.cn:5000/dcu/admin/base/dev:rockylinux8.6-mpi5.0-gcc10.3-cmake3.29-py3.10-mkl2020.4.304
      volumes:
        - /ArchivedFile:/ArchivedFile:ro
        - /opt/hyhal/:/opt/hyhal/:ro
      options: >-
        --shm-size=16g
        --network=host
        --device=/dev/kfd
        --device=/dev/dri/
        --group-add=video
        --privileged
    env:
      DEVPI_NIGHTLY_USER: ${{ secrets.DEVPI_NIGHTLY_USER }}
      DEVPI_NIGHTLY_PASSWORD: ${{ secrets.DEVPI_NIGHTLY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install DTK and AICC
        shell: bash
        run: |
          set -eu

          cp -f "${DTK_PKG}" /opt/
          cd /opt
          tar -xzf "$(basename "${DTK_PKG}")"
          mv dtk-* dtk

          src_dir="/ArchivedFile/ai_cc/nightly"
          latest_run=$(cd "${src_dir}" && find . -maxdepth 1 -type f -name 'dtk_llvm_*.run' -printf '%f\n' | sed 's/\.run$//' | sort -t '_' -k4 -nr | head -n1)
          if [[ -n "${latest_run}" ]]; then
            cp "${src_dir}/${latest_run}.run" "${GITHUB_WORKSPACE}/"
            cd "${GITHUB_WORKSPACE}"
            chmod +x "${latest_run}.run"
            yes | bash "${latest_run}.run"
            echo "AICC installation completed"
          else
            echo "No AICC installer found; skipping installation"
          fi

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          source /opt/dtk/env.sh
          cd "${GITHUB_WORKSPACE}"
          pip3 install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple --trusted-host pypi.tuna.tsinghua.edu.cn
          bash scripts/install_with_torch.sh "torch==${TORCH_VERSION}"
          bash scripts/install_with_torch.sh torchvision ${TORCH_VERSION}
          bash scripts/install_with_torch.sh triton ${TORCH_VERSION}
          pip install numpy==1.24.3 wheel cloudpickle
          pip install auditwheel patchelf==0.17.2.4 ciupload

      - name: Build and repair wheel
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/compile.sh > compile.log 2>&1
          tail -n 100 compile.log
          source /opt/dtk/env.sh
          bash scripts/repair_manylinux.sh

      - name: Set package version and publish
        shell: bash
        run: |
          set -euo pipefail
          source /opt/dtk/env.sh
          : "${DEVPI_NIGHTLY_USER:?Missing DEVPI_NIGHTLY_USER GitHub secret}"
          : "${DEVPI_NIGHTLY_PASSWORD:?Missing DEVPI_NIGHTLY_PASSWORD GitHub secret}"

          dtk_ver=$(echo "${DTK_PKG}" | grep -oP 'dtk\K[0-9]+\.[0-9]+' | tr -d '.')
          torch_ver=$(echo "${TORCH_VERSION}" | tr -d '.')
          local_ver="dtk${dtk_ver}.torch${torch_ver}.$(date +%y%m%d%H%M).g$(git rev-parse --short=6 HEAD)"

          CIUpload --repair --torch_version "${TORCH_VERSION}" --set_local_version "${local_ver}" --outputdir output -f dist/*.whl
          CIUpload --devpi_url "${DEVPI_URL}" --devpi_user "${DEVPI_NIGHTLY_USER}" --devpi_password "${DEVPI_NIGHTLY_PASSWORD}" --dtk_pkg_name "$(basename "${DTK_PKG}")" -f output/*.whl

      - name: Upload published wheel
        uses: actions/upload-artifact@v4
        with:
          name: published-apex-wheel
          path: output/*.whl
          if-no-files-found: error
          retention-days: 30
